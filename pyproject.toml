[project]
name = "onboarding-quiz-coach"
version = "2.0.0"
description = "Adaptive onboarding quiz with scored attempts and LLM coaching tips for missed questions."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
